<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>390px 캡처용 (임시)</title>
<style>
  html,body{margin:0;background:#222}
  #f{border:0;display:block;background:#fff}
  #out{position:fixed;right:8px;top:8px;max-width:300px;margin:0;padding:8px;
       background:rgba(0,0,0,.75);color:#7ee787;font:11px/1.4 monospace;white-space:pre-wrap;z-index:9}
</style>
</head>
<body>
<iframe id="f" width="390" height="844" scrolling="no"></iframe>
<pre id="out">…</pre>
<script>
const q = new URLSearchParams(location.search);
const file = q.get('file') || 'index.html';
const H = +(q.get('h') || 844);
const Y = +(q.get('y') || 0);
const f = document.getElementById('f');
f.width = 390; f.height = H;
f.src = file;
f.onload = () => {
  const d = f.contentDocument, w = f.contentWindow;
  try{
    d.head.insertAdjacentHTML('beforeend',
      '<style>html::-webkit-scrollbar{width:0!important;height:0!important}html{scrollbar-width:none!important}</style>');
  }catch(e){}
  setTimeout(()=>{ try{ const c=d.querySelector('[aria-label="설치 안내 닫기"]'); if(c) c.click(); }catch(e){} }, 500);
  setTimeout(()=>{
    w.scrollTo(0, Y);
    setTimeout(()=>{
      const R=el=>{ if(!el) return null; const r=el.getBoundingClientRect(); return {x:Math.round(r.x),y:Math.round(r.y),w:Math.round(r.width),h:Math.round(r.height)}; };
      const v=d.getElementById('familyIntroVideo');
      const m={
        file, scrollY:Math.round(w.scrollY),
        innerWidth:w.innerWidth, clientWidth:d.documentElement.clientWidth,
        docHeight:Math.round(d.documentElement.scrollHeight),
        docScrollWidth:Math.round(d.documentElement.scrollWidth),
        header:R(d.querySelector('header')), video:R(v),
        videoCard:R(d.querySelector('.video-card')), sosBtn:R(d.getElementById('sosBtn'))
      };
      document.getElementById('out').textContent = JSON.stringify(m,null,1);
      document.title = 'h='+(m.header?m.header.h:'-')+' v='+(m.video?m.video.w+'x'+m.video.h:'-')+' doc='+m.docHeight+' y='+m.scrollY;
    }, 350);
  }, 1200);
};
</script>
</body>
</html>
